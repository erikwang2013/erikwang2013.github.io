<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="keywords" content="开源项目中心·艾瑞可erik">
  <meta name="description" content="艾瑞可erik个人开源的项目介绍">
  <title>开源项目中心·艾瑞可erik</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>

<body>
  <div id="app">
    <div id="scene"></div>

    <div id="hud">
      <h1>开源项目中心 <span class="sub">Open Source Project Repositor</span></h1>
      <div id="search">
        <input id="search-input" type="text" placeholder="🔍 搜索项目名称、简介…" autocomplete="off">
        <button id="search-clear" aria-label="清除搜索">×</button>
      </div>
      <div id="filters"></div>
    </div>

    <div id="view-switch">
      <button id="view-galaxy" class="view-btn active">🪐 星球</button>
      <button id="view-cards" class="view-btn">🗂 卡片</button>
    </div>

    <button id="back-top" aria-label="返回顶部">↑</button>

    <div id="card-view" class="hidden">
      <div id="card-grid"></div>
      <div id="card-pager">
        <button id="pager-prev" class="pager-btn">◀ 上一页</button>
        <span id="pager-info">第 1 / 1 页</span>
        <button id="pager-next" class="pager-btn">下一页 ▶</button>
      </div>
    </div>

    <a id="erik-link" href="https://erik.xyz" target="_blank" rel="noopener noreferrer">艾瑞可erik ↗</a>

    <div id="detail-panel" class="hidden">
      <button id="panel-close" aria-label="关闭">×</button>
      <div id="panel-content"></div>
    </div>

    <div id="webgl-fallback" class="hidden">您的浏览器不支持 WebGL,无法显示 3D 场景。</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from './vendor/OrbitControls.js';
    import { loadData } from './js/data.js';
    import { buildScene } from './js/scene.js';
    import { initInteraction } from './js/main.js';

    const data = await loadData();

    const fallback = document.getElementById('webgl-fallback');
    try {
      new THREE.WebGLRenderer();
    } catch (err) {
      fallback.classList.remove('hidden');
      throw err;
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('scene').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 1000);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 30;
    controls.maxDistance = 700;

    const HOME = { pos: new THREE.Vector3(0, 135, 225), target: new THREE.Vector3(0, 0, 0) };
    camera.position.copy(HOME.pos);
    controls.target.copy(HOME.target);
    window.__cam = camera; // 调试钩子(playwright 验证用)

    const galaxy = buildScene(scene, data);
    const interaction = initInteraction({ renderer, scene, camera, controls, galaxy, home: HOME, data });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      galaxy.update(dt, camera);
      interaction.update(dt);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>

</html>
